<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff dashboard — QueueFlow</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="staff.js"></script></head>
<body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">Q</span> QueueFlow</a><nav><a href="index.html">Customer view</a><a href="track.html">Track ticket</a></nav></header>
<main class="shell dashboard-shell"><div class="page-intro"><div class="eyebrow">QUEUEFLOW FOR TEAMS</div><h1>Staff dashboard</h1><p>Manage customers and keep the line moving.</p></div>
<section id="auth-panel" class="panel auth-panel"><h2>Staff sign in</h2><form id="login-form"><label for="email">Email</label><input id="email" type="email" required placeholder="staff@example.com"><label for="password">Password</label><input id="password" type="password" required placeholder="Your password"><button class="button primary full">Sign in</button><p class="form-note" id="auth-message" role="status">Staff accounts must be created in Supabase Authentication first.</p></form></section>
<section id="dashboard" class="hidden"><div class="dashboard-head"><div><div class="eyebrow">LIVE OVERVIEW</div><h2>Current queue</h2></div><button class="button secondary" id="logout-button">Sign out</button></div><div class="stats"><article class="stat-card"><span>Waiting</span><strong id="waiting-count">0</strong></article><article class="stat-card"><span>Now serving</span><strong id="serving-number">—</strong></article><article class="stat-card"><span>Completed</span><strong id="completed-count">0</strong></article></div><div id="staff-message" class="form-note" role="status"></div><div id="ticket-list" class="ticket-list"></div></section>
</main><footer>QueueFlow <span>·</span> Staff workspace</footer></body></html>
